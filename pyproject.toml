[project]
name = "lockstep-reference"
version = "0.2.0"
description = "Lockstep: the public specification, CPU references, formal core and conformance kits for bit-exact verifiable transformer inference"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Perica Glavas", email = "pg@lambda.so" }, { name = "Maksym Yakovenko", email = "max@lambda.so" }, { name = "Logan Allen", email = "logan@nationalcompute.io" }]
dependencies = ["numpy>=1.26", "torch>=2.4"]

[project.optional-dependencies]
tools = ["safetensors>=0.4"]

